<title>Panel de bots · Terminal</title>
<style>
  :root{
    --bg:#090C10; --panel:#0B0F14; --line:#18212A; --line2:#121a21; --faint:#3A4A54;
    --txt:#C3D2CB; --bright:#EAFBF1; --lbl:#697F75;
    --pos:#43D17F; --neg:#FF6B5C; --amb:#E0B54A; --accent:#43D17F;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .scr{max-width:880px;margin:0 auto;padding:clamp(.9rem,3vw,1.6rem);}
  .win{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}

  .bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.75rem 1.1rem;border-bottom:1px solid var(--line);background:#0d1219;flex-wrap:wrap;}
  .bar .brand{color:var(--lbl);font-size:.76rem;letter-spacing:.06em;}
  .bar .brand b{color:var(--accent);font-weight:600;}
  .live{color:var(--pos);font-size:.74rem;letter-spacing:.04em;display:inline-flex;align-items:center;gap:.45rem;}
  .live .d{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block;}
  .live.stale{color:var(--amb);} .live.stale .d{background:var(--amb);}
  .live.down{color:var(--neg);} .live.down .d{background:var(--neg);}
  @media (prefers-reduced-motion:no-preference){.live .d{animation:blink 1.8s ease-in-out infinite;}}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}

  .sys{display:flex;gap:.4rem 1.1rem;flex-wrap:wrap;align-items:center;padding:.6rem 1.1rem;border-bottom:1px solid var(--line);font-size:.75rem;color:var(--lbl);}
  .sys .on{color:var(--txt);display:inline-flex;align-items:center;gap:.3rem;} .sys .on i{color:var(--pos);font-style:normal;font-size:.7em;}
  .sys .on.off i{color:var(--neg);}
  .sys .k{color:var(--lbl);} .sys .k b{color:var(--txt);font-weight:400;}
  .sys .sep{color:var(--faint);}

  .body{padding:0 1.1rem;}
  .hint{color:var(--faint);font-size:.7rem;letter-spacing:.04em;padding:.55rem 0 .1rem;}

  /* ---------- tarjeta colapsable ---------- */
  details.bot{border-bottom:1px solid var(--line);}
  details.bot:last-of-type{border-bottom:none;}
  summary.bsum{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.5rem;padding:.95rem 0;}
  summary.bsum::-webkit-details-marker{display:none;}
  summary.bsum:focus-visible{outline:1px solid var(--faint);outline-offset:3px;border-radius:4px;}
  .tag{color:var(--bg);background:var(--accent);font-weight:700;font-size:.72rem;letter-spacing:.09em;padding:.16rem .52rem;border-radius:5px;flex:none;}
  .tag.idle{background:#233039;color:var(--txt);}
  .stw{font-size:.72rem;letter-spacing:.03em;color:var(--lbl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stw.live-on{color:var(--pos);} .stw.wait{color:var(--amb);} .stw.off{color:var(--amb);}
  .retired{margin:.1rem 0 .75rem;font-size:.73rem;color:var(--amb);line-height:1.5;border-left:2px solid var(--amb);padding-left:.6rem;border-radius:0;}
  .bres{margin-left:auto;font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;}
  .bres.pos{color:var(--pos);} .bres.neg{color:var(--neg);} .bres.zero{color:var(--txt);}
  .bres .u{font-size:.64rem;color:var(--lbl);font-weight:400;}
  .chev{color:var(--faint);font-size:.8rem;transition:transform .15s;flex:none;}
  details.bot[open] .chev{transform:rotate(90deg);}
  .bdetail{padding:.1rem 0 1.2rem;}
  .desc2{color:var(--lbl);font-size:.75rem;margin:.1rem 0 .75rem;}

  .hero{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;}
  .sub{font-size:.73rem;color:var(--lbl);letter-spacing:.02em;max-width:44ch;}
  .hd2{color:var(--lbl);font-size:.75rem;margin:.1rem 0 .6rem;}
  .spark{width:200px;max-width:44vw;height:42px;display:block;}

  .posline{margin:.9rem 0 .1rem;font-size:.9rem;}
  .posline .lbl{color:var(--lbl);font-size:.72rem;letter-spacing:.06em;margin-right:.5rem;}
  .lng{color:var(--pos);font-weight:600;} .sht{color:var(--neg);font-weight:600;} .flt{color:var(--lbl);} .px{color:var(--lbl);font-size:.82rem;}

  .legs{margin:.5rem 0 .1rem;display:flex;flex-direction:column;gap:.3rem;}
  .leg{display:flex;align-items:baseline;gap:.55rem;font-size:.92rem;}
  .leg .side{font-weight:600;} .leg .side.lng{color:var(--pos);} .leg .side.sht{color:var(--neg);}
  .leg .tagx{color:var(--lbl);font-size:.68rem;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:.02rem .32rem;}
  .cancel{color:var(--faint);font-size:.72rem;margin:.15rem 0 0 .2rem;}
  .freebie{margin:.6rem 0 0;font-size:.72rem;color:var(--lbl);line-height:1.5;}
  .freebie b{color:var(--txt);font-weight:400;}

  .meta{margin:.85rem 0 0;font-size:.74rem;color:var(--lbl);display:flex;flex-wrap:wrap;gap:.15rem .55rem;align-items:baseline;}
  .meta .m b{color:var(--txt);font-weight:400;}
  .meta .m b.g{color:var(--pos);} .meta .m b.r{color:var(--neg);}
  .meta .sep{color:var(--faint);}

  .pnld{margin:.5rem 0 0;font-size:.74rem;color:var(--lbl);line-height:1.5;}
  .pnld .rz{color:var(--txt);} .pnld .rz.g{color:var(--pos);} .pnld .rz.r{color:var(--neg);}

  details.log{margin:.75rem 0 0;}
  details.log>summary{cursor:pointer;list-style:none;color:var(--lbl);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:.4rem;padding:.15rem 0;user-select:none;}
  details.log>summary::-webkit-details-marker{display:none;}
  details.log>summary .chev{font-size:.72rem;}
  details.log[open]>summary .chev{transform:rotate(90deg);}
  .t{display:grid;grid-template-columns:6.6rem 3rem 1fr auto;gap:.5rem;padding:.28rem 0;border-bottom:1px solid var(--line2);font-size:.77rem;font-variant-numeric:tabular-nums;}
  .t:first-of-type{margin-top:.35rem;} .t:last-child{border-bottom:none;}
  .t .tm{color:var(--lbl);} .t .sd{font-weight:700;font-size:.71rem;letter-spacing:.03em;}
  .t .buy{color:var(--pos);} .t .sell{color:var(--neg);} .t .qt{color:var(--txt);} .t .pr{text-align:right;color:var(--txt);}

  .wait{color:var(--lbl);font-size:.82rem;margin:.9rem 0 .1rem;}
  .wait .c{color:var(--accent);}
  .nodata{color:var(--lbl);font-size:.82rem;}

  /* total consolidado */
  .totalbar{padding:1.05rem 1.1rem;border-top:2px solid var(--line);background:#0d1219;display:flex;justify-content:space-between;align-items:flex-start;gap:.7rem 1rem;flex-wrap:wrap;}
  .totalbar .lab{color:var(--txt);font-size:.82rem;letter-spacing:.05em;}
  .totalbar .split{font-size:.74rem;color:var(--lbl);margin-top:.4rem;}
  .totalbar .split b{font-weight:400;color:var(--txt);font-variant-numeric:tabular-nums;}
  .totalbar .split b.g{color:var(--pos);} .totalbar .split b.r{color:var(--neg);}
  .totalbar .note{color:var(--faint);font-size:.7rem;margin-top:.35rem;max-width:48ch;line-height:1.5;}
  .totalbar .amtwrap{text-align:right;margin-left:auto;}
  .totalbar .amt{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
  .totalbar .amt .u{font-size:.72rem;color:var(--lbl);font-weight:400;}
  .totalbar .amt.pos{color:var(--pos);} .totalbar .amt.neg{color:var(--neg);} .totalbar .amt.zero{color:var(--txt);}
  .totalbar .word{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;margin-top:.28rem;}
  .totalbar .word .tpct{font-weight:700;margin-left:.15rem;}
  .totalbar .word.pos{color:var(--pos);} .totalbar .word.neg{color:var(--neg);} .totalbar .word.zero{color:var(--lbl);}

  .foot{padding:.95rem 1.1rem 1.15rem;border-top:1px solid var(--line);color:var(--faint);font-size:.72rem;}
  .foot p{margin:.35rem 0;max-width:76ch;line-height:1.6;}
  .foot .amb{color:var(--amb);} .foot b{color:var(--txt);font-weight:400;}
  .cursor{color:var(--accent);}
  @media (prefers-reduced-motion:no-preference){.cursor{animation:blink 1.1s step-end infinite;}}

  @media (max-width:540px){
    body{overflow-x:hidden;}
    .scr{padding:.7rem;}
    .bar,.sys{padding:.55rem .85rem;}
    .body{padding:0 .85rem;}
    .bres{font-size:1.05rem;}
    .spark{width:100%;max-width:100%;height:40px;margin-top:.55rem;}
    .hero{gap:.3rem;}
    .t{grid-template-columns:4.9rem 2.5rem 1fr auto;gap:.35rem;font-size:.73rem;}
    .totalbar .amt{font-size:1.7rem;}
    .foot{padding:.85rem .85rem 1rem;}
  }
</style>

<div class="scr">
  <div class="win">
    <div class="bar">
      <span class="brand">◢ <b>bots</b> // binance testnet · paper <span class="cursor">▍</span></span>
      <span class="live" id="live"><span class="d"></span><span id="live-txt">conectando…</span></span>
    </div>
    <div class="sys" id="sys"></div>
    <div class="body" id="body"></div>
    <div class="totalbar" id="total"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var DATA_URL = "https://raw.githubusercontent.com/adrianmatiasyommi/bots-data/main/data.json";

  var DEMO = {
    generated_at: "2026-07-31T11:42:00Z", network: "testnet", demo: true,
    health: {spot:true, futuros:true, scalp:true, carry:true, monitor:true, uptime:"24h"},
    spot: {label:"spot", available:true, equity:76180.12, cash:57427.07,
      position:[{symbol:"ETHUSDT", qty:9.95, avg:1902.00, mark:1877.16, unrealized:-247.28}],
      kill_ok:true, n_trades:9, last_trade_ts:"2026-07-30T13:00:00Z",
      recent_trades:[{ts:"2026-07-30T13:00:00Z", symbol:"ETHUSDT", side:"VENTA", qty:0.03, price:1925.29}],
      equity_series:[76718,76408,76360,76400,76353,76490,76569,76598,76515,76179],
      realized_total:-156.46, realized_by_symbol:{ETHUSDT:-156.46}, unrealized_total:-247.28},
    futuros: {label:"futuros", available:true, equity:5000, cash:5000, position:[], kill_ok:true,
      n_trades:0, last_trade_ts:null, recent_trades:[], equity_series:[5000,5000,5000,5000],
      realized_total:null, realized_by_symbol:{}, unrealized_total:null},
    scalp: {label:"scalp", available:true, equity:4985.30, cash:4985.30,
      position:[], kill_ok:true, n_trades:37, last_trade_ts:"2026-08-01T15:41:00Z",
      recent_trades:[{ts:"2026-08-01T15:41:00Z", symbol:"SOLUSDT", side:"VENTA", qty:2.1, price:182.40}],
      equity_series:[5000,4998,4996,4995,4993,4991,4992,4989,4987,4985.3],
      realized_total:-14.70, realized_by_symbol:{SOLUSDT:-14.70}, unrealized_total:0},
    carry: {label:"carry", available:true, equity:81570, cash:0,
      position:[{symbol:"ADAUSDT", qty:4602.9, avg:0.09, mark:0.17, unrealized:402.3},
        {symbol:"ADAUSDT.PERP", qty:-1143.0, avg:0.17, mark:null, unrealized:null},
        {symbol:"BNBUSDT", qty:1.0, avg:0.0, mark:575.79, unrealized:575.79}],
      kill_ok:true, n_trades:2, last_trade_ts:"2026-08-01T22:21:56Z",
      recent_trades:[{ts:"2026-08-01T22:21:56Z", symbol:"ADAUSDT", side:"COMPRA", qty:1143.5, price:0.17}],
      equity_series:[], realized_total:-2.2, realized_by_symbol:{ADAUSDT:-2.2}, unrealized_total:1774.67}
  };

  var BOTS = [
    {key:"spot",    title:"SPOT",    desc:"ma_cross 50/200 · 1h · BTC ETH SOL",        color:"#43D17F", waiting:null},
    {key:"futuros", title:"FUTUROS", desc:"z-score 30/2.0 · 1d · BTC ETH · corto 1x",  color:"#7FB2A0", waiting:'esperando señal <span class="c">±2σ</span> — evalúa cada día y elige esperar'},
    {key:"scalp",   title:"SCALP",   desc:"scalp_meanrev · 1m · SOLUSDT · experimento cerrado", color:"#DBAA46", retired:true, waiting:null},
    {key:"carry",   title:"CARRY",   desc:"cash-and-carry · funding · delta-neutral",  color:"#4FB6C6", carry:true}
  ];

  var MINUS = "−";
  function numf(n, dec){ return Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
  function grp(n, dec){ if(n==null||isNaN(n)) return "—"; return (n<0?MINUS:"")+numf(n,dec); }
  function signed(n, dec){ if(n==null||isNaN(n)) return "—"; return (n<0?MINUS:"+")+numf(n,dec); }
  function price(n){ if(n==null||isNaN(n)) return "—"; var dec=Math.abs(n)>=100?2:(Math.abs(n)>=1?4:6); return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:dec}); }
  function qtyFmt(n){ if(n==null||isNaN(n)) return "—"; return Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:n>=1000?0:4}); }
  function base(sym){ return (sym||"").replace(/\.PERP$/,"").replace(/USDT$/,"").replace(/USD$/,""); }
  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
  function pad2(x){ return (x<10?"0":"")+x; }
  function fmtTs(iso){ if(!iso) return "—"; var d=new Date(iso); if(isNaN(d)) return "—"; return pad2(d.getUTCDate())+"/"+pad2(d.getUTCMonth()+1)+" "+pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes()); }
  function fmtClock(iso){ var d=iso?new Date(iso):null; if(!d||isNaN(d)) return "—"; return d.getUTCFullYear()+"-"+pad2(d.getUTCMonth()+1)+"-"+pad2(d.getUTCDate())+" "+pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes())+" UTC"; }

  function sparkSVG(data, col){
    data = (data||[]).filter(function(v){return typeof v==="number"&&!isNaN(v);});
    var W=200,H=42,pad=3,n=data.length;
    if(n<2) return '<svg class="spark" viewBox="0 0 '+W+' '+H+'"></svg>';
    var mn=Math.min.apply(null,data),mx=Math.max.apply(null,data),rng=(mx-mn)||1;
    var xs=function(i){return (pad+(W-2*pad)*(i/(n-1))).toFixed(1);};
    var ys=function(v){return (pad+(H-2*pad)*(1-(v-mn)/rng)).toFixed(1);};
    var pts=data.map(function(v,i){return xs(i)+","+ys(v);}).join(" ");
    var area="M"+pad+","+(H-pad)+" L"+pts.split(" ").join(" L")+" L"+(W-pad)+","+(H-pad)+" Z";
    return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="tendencia del equity">'
      +'<path d="'+area+'" fill="'+col+'" opacity="0.10"/>'
      +'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
      +'<circle cx="'+xs(n-1)+'" cy="'+ys(data[n-1])+'" r="2.5" fill="'+col+'"/></svg>';
  }

  function tradesLog(trades){
    trades = trades||[];
    if(!trades.length) return "";
    var rows = trades.slice(0,8).map(function(t){
      var buy = /COMPRA|BUY/i.test(t.side||"") || (t.qty!=null && t.side==null && t.qty>0);
      return '<div class="t"><span class="tm">'+fmtTs(t.ts)+'</span>'
        +'<span class="sd '+(buy?"buy":"sell")+'">'+(buy?"BUY":"SELL")+'</span>'
        +'<span class="qt">'+qtyFmt(t.qty)+" "+base(t.symbol)+'</span>'
        +'<span class="pr">'+price(t.price)+'</span></div>';
    }).join("");
    return '<details class="log"><summary><span class="chev">▸</span> operaciones ('+trades.length+')</summary>'+rows+'</details>';
  }

  function statusWord(inPos, nTrades){
    if(inPos) return {w:"● operando", c:"live-on"};
    if(nTrades>0) return {w:"○ sin posición", c:""};
    return {w:"○ esperando", c:"wait"};
  }

  function card(summaryHTML, detailHTML){
    return '<details class="bot"><summary class="bsum">'+summaryHTML+'<span class="chev">▸</span></summary>'
      +'<div class="bdetail">'+detailHTML+'</div></details>';
  }

  function renderBot(cfg, d){
    if(!d || d.available===false){
      return card('<span class="tag idle">'+cfg.title+'</span><span class="stw">sin datos</span>',
        '<div class="nodata">— sin datos disponibles para este bot</div>');
    }
    if(cfg.carry) return renderCarry(cfg, d);

    var poss = (d.position||[]).filter(function(p){ return Math.abs(p.qty||0) > 1e-9; });
    var nT = d.n_trades||0;
    var stw = statusWord(poss.length>0, nT);
    var tag = (nT>0||poss.length) ? '<span class="tag">'+cfg.title+'</span>' : '<span class="tag idle">'+cfg.title+'</span>';
    if(cfg.retired){ stw = {w:"⏹ detenido", c:"off"}; tag = '<span class="tag idle">'+cfg.title+'</span>'; }

    var rz=d.realized_total, uz=d.unrealized_total;
    var hasPnl = (rz!=null) || (uz!=null);

    var resHtml, subLine;
    if(hasPnl){
      var pnl=(rz||0)+(uz||0);
      var rcls = pnl<-0.005?"neg":(pnl>0.005?"pos":"zero");
      resHtml = '<span class="bres '+rcls+'">'+signed(pnl,2)+' <span class="u">USDT</span></span>';
      var s=d.equity_series||[]; var pc=(s.length>=2&&s[0])?(s[s.length-1]-s[0])/s[0]*100:null;
      var trend = pc==null?"":(Math.abs(pc)<0.1?" · plano en la ventana":" · "+signed(pc,1)+"% en la ventana");
      subLine = 'resultado neto (cerrado + abierto) · equity '+grp(d.equity,0)+trend;
    } else {
      resHtml = '<span class="bres zero">'+grp(d.equity,0)+' <span class="u">eq</span></span>';
      subLine = 'equity de la cuenta · sin operar aún';
    }
    var summary = tag+'<span class="stw '+stw.c+'">'+stw.w+'</span>'+resHtml;

    var posHtml;
    if(poss.length){
      var p=poss[0]; var long=p.qty>=0;
      posHtml = '<div class="posline"><span class="lbl">POSICIÓN</span><span class="'+(long?"lng":"sht")+'">'+(long?"▲ LONG ":"▼ SHORT ")+qtyFmt(p.qty)+" "+base(p.symbol)+'</span> <span class="px">@ '+price(p.avg)+(p.mark!=null?" · marca "+price(p.mark):"")+'</span></div>';
    } else if(cfg.waiting){
      posHtml = '<div class="wait">&gt; '+cfg.waiting+'</div>';
    } else if(cfg.retired){
      posHtml = '<div class="posline"><span class="lbl">POSICIÓN</span><span class="flt">— detenido · sin posición</span></div>';
    } else {
      posHtml = '<div class="posline"><span class="lbl">POSICIÓN</span><span class="flt">— flat · sin posiciones</span></div>';
    }
    var meta = '<div class="meta">'
      +'<span class="m">cash <b>'+grp(d.cash,0)+'</b></span><span class="sep">·</span>'
      +'<span class="m">trades <b>'+nT+'</b></span><span class="sep">·</span>'
      +'<span class="m">kill <b class="'+(d.kill_ok?"g":"r")+'">'+(d.kill_ok?"OK":"TRIP")+'</b></span><span class="sep">·</span>'
      +'<span class="m">última <b>'+(d.last_trade_ts?fmtTs(d.last_trade_ts):"—")+'</b></span></div>';
    var pnld="";
    if(hasPnl){
      var syms=Object.keys(d.realized_by_symbol||{});
      var rzNote = syms.length===1?(" ("+base(syms[0])+")"):"";
      var rzCls = rz==null?"":(rz<0?"r":(rz>0?"g":""));
      var uzCls = uz==null?"":(uz<0?"r":(uz>0?"g":""));
      pnld = '<div class="pnld">realizado <span class="rz '+rzCls+'">'+signed(rz,2)+'</span>'+rzNote
        +' · no realizado <span class="rz '+uzCls+'">'+signed(uz,2)+'</span>'
        +(poss.length?" (posición abierta)":" (sin posición)")+'</div>';
    }
    var retiredNote = cfg.retired
      ? '<div class="retired">◼ experimento cerrado — confirmó que pierde por comisiones. Frenado el 04/08; estos números son su foto final (congelada).</div>'
      : "";
    var detail = '<div class="desc2">'+cfg.desc+'</div>'+retiredNote
      +'<div class="hero"><div class="sub">'+subLine+'</div>'+sparkSVG(d.equity_series,cfg.color)+'</div>'
      +posHtml+meta+pnld+tradesLog(d.recent_trades);

    return card(summary, detail);
  }

  function renderCarry(cfg, d){
    var pos = (d.position||[]).filter(function(p){ return Math.abs(p.qty||0) > 1e-9; });
    var perps = pos.filter(function(p){ return /\.PERP$/.test(p.symbol||""); });
    var inCarry = perps.length>0;
    var stw = inCarry ? {w:"◆ EN CARRY", c:"live-on"} : {w:"○ esperando", c:"wait"};
    var tag = '<span class="tag'+(inCarry?'':' idle')+'"'+(inCarry?' style="background:'+cfg.color+'"':'')+'>'+cfg.title+'</span>';

    var carrySpot={};
    perps.forEach(function(p){ carrySpot[base(p.symbol)] = (carrySpot[base(p.symbol)]||0) + Math.abs(p.qty); });
    var activeBases = perps.map(function(p){ return base(p.symbol); }).filter(function(v,i,a){ return a.indexOf(v)===i; });

    var resHtml = inCarry
      ? '<span class="bres" style="color:'+cfg.color+';font-size:.95rem">◆ '+activeBases.join(" · ")+'</span>'
      : '<span class="bres zero" style="font-size:.95rem">esperando</span>';
    var summary = tag+'<span class="stw '+stw.c+'">'+stw.w+'</span>'+resHtml;

    var legsHtml;
    if(inCarry){
      var legs="";
      perps.forEach(function(p){
        var b=base(p.symbol), sz=Math.abs(p.qty);
        legs += '<div class="leg"><span class="side lng">▲ LONG</span> '+qtyFmt(sz)+" "+b+' <span class="tagx">spot</span></div>'
             +  '<div class="leg"><span class="side sht">▼ SHORT</span> '+qtyFmt(sz)+" "+b+' <span class="tagx">perp</span></div>';
      });
      legsHtml = '<div class="hd2">delta-neutral · las dos patas se cancelan, cobra funding</div>'
        +'<div class="legs">'+legs+'</div>'
        +'<div class="cancel">↳ misma cantidad en ambas patas → sin exposición a la dirección</div>';
    } else {
      legsHtml = '<div class="hd2">funding bajo el umbral · abre cuando ≥ 1 bps</div>';
    }

    var frb=[];
    pos.forEach(function(p){
      if(/\.PERP$/.test(p.symbol||"")) return;
      var b=base(p.symbol);
      var free = p.qty - (carrySpot[b]||0);
      if(free > 1e-6) frb.push(qtyFmt(free)+" "+b);
    });
    var freebie = frb.length
      ? '<div class="freebie">saldo suelto (regalos del testnet, <b>no operado por el bot</b>): '+frb.join(" · ")+'</div>'
      : "";
    var meta = '<div class="meta">'
      +'<span class="m">trades <b>'+(d.n_trades||0)+'</b></span><span class="sep">·</span>'
      +'<span class="m">kill <b class="'+(d.kill_ok?"g":"r")+'">'+(d.kill_ok?"OK":"TRIP")+'</b></span><span class="sep">·</span>'
      +'<span class="m">última <b>'+(d.last_trade_ts?fmtTs(d.last_trade_ts):"—")+'</b></span></div>';
    var rz=d.realized_total, pnld="";
    if(rz!=null){
      pnld = '<div class="pnld">funding/PnL realizado <span class="rz '+(rz<0?"r":(rz>0?"g":""))+'">'+signed(rz,2)+'</span> USDT · el equity de la cuenta es compartido con los otros bots</div>';
    }
    var detail = '<div class="desc2">'+cfg.desc+'</div>'+legsHtml+freebie+meta+pnld+tradesLog(d.recent_trades);
    return card(summary, detail);
  }

  // ---------- total consolidado: resultado real, separado y con % ----------
  function renderTotal(data){
    var real=0, open=0, account=0;
    BOTS.forEach(function(c){
      var d=data[c.key]; if(!d||d.available===false) return;
      real += (d.realized_total!=null)?d.realized_total:0;
      // el "no realizado" del carry es apreciación de las freebies (su posición
      // real es delta-neutral ~0); no cuenta como resultado de trading.
      open += (!c.carry && d.unrealized_total!=null)?d.unrealized_total:0;
      account += (d.equity!=null)?d.equity:0;
    });
    var total=real+open;
    var cls = total<-0.005?"neg":(total>0.005?"pos":"zero");
    var word = total<-0.005?"↓ perdido":(total>0.005?"↑ ganado":"= sin cambios");
    var pct = account>0 ? (total/account*100) : null;
    var pctHtml = pct!=null ? '<span class="tpct">'+signed(pct,2)+'%</span>' : '';
    return '<div><div class="lab">Total · todas las operaciones</div>'
      +'<div class="split">realizado <b class="'+(real<0?"r":(real>0?"g":""))+'">'+signed(real,2)+'</b>'
      +' · abierto <b class="'+(open<0?"r":(open>0?"g":""))+'">'+signed(open,2)+'</b></div>'
      +'<div class="note">resultado real de trading. El % es sobre el equity total de la cuenta (testnet, inflado por las monedas de regalo). No incluye esas freebies ni el hedge neutral del carry.</div></div>'
      +'<div class="amtwrap"><div class="amt '+cls+'">'+signed(total,2)+' <span class="u">USDT</span></div>'
      +'<div class="word '+cls+'">'+word+' '+pctHtml+'</div></div>';
  }

  function renderSys(data){
    var h = data.health||{};
    function dot(name,up){ return '<span class="on'+(up===false?" off":"")+'"><i>●</i>'+name+'</span>'; }
    var parts=[ '<span class="k">SYS</span>' ];
    var dots=[];
    dots.push(dot("spot", h.spot));
    dots.push(dot("futuros", h.futuros));
    if(h.scalp!==undefined) dots.push(dot("scalp", h.scalp));
    if(h.carry!==undefined) dots.push(dot("carry", h.carry));
    if(h.monitor!==undefined) dots.push(dot("monitor", h.monitor));
    parts.push(dots.join('<span class="sep"> </span>'));
    var kv=[];
    if(h.uptime) kv.push('<span class="k">uptime <b>'+esc(h.uptime)+'</b></span>');
    if(h.ws_stalls!==undefined) kv.push('<span class="k">ws-stalls <b>'+h.ws_stalls+'</b></span>');
    if(h.errores!==undefined) kv.push('<span class="k">errores <b>'+h.errores+'</b></span>');
    if(kv.length) parts.push('<span class="sep">│</span>'+kv.join('<span class="sep"> </span>'));
    return parts.join(" ");
  }

  function renderLive(data){
    var el=document.getElementById("live"), txt=document.getElementById("live-txt");
    el.className="live";
    var gen = data.generated_at?new Date(data.generated_at):null;
    var ageMin = (gen&&!isNaN(gen)) ? (Date.now()-gen.getTime())/60000 : null;
    var stamp = fmtClock(data.generated_at);
    if(data.demo){ el.className="live stale"; txt.textContent="DEMO · "+stamp; return; }
    if(ageMin===null){ txt.textContent=stamp; return; }
    if(ageMin>30){ el.className="live down"; txt.textContent="SIN ACTUALIZAR · "+stamp; }
    else if(ageMin>12){ el.className="live stale"; txt.textContent="ATRASADO "+Math.round(ageMin)+"m · "+stamp; }
    else{ txt.textContent="LIVE · "+stamp; }
  }

  function renderFoot(data){
    var p1='<p><span class="amb">testnet · plata de juguete.</span> el <b>equity</b> de cada bot está inflado por las monedas de regalo del testnet — no es ganancia. la señal limpia es el <b>resultado</b> (el Total de acá arriba y el de cada bot, en verde/rojo), no el equity.</p>';
    var p2='<p>se actualiza solo · la VM empuja una foto cada ~5 min → almacén → esta web. tocá cada bot para ver el detalle. última foto: '+fmtClock(data.generated_at)+'.'+(data.demo?' <span class="amb">(mostrando demo — sin conexión al almacén)</span>':'')+'</p>';
    return p1+p2;
  }

  function paint(data){
    document.getElementById("sys").innerHTML = renderSys(data);
    document.getElementById("body").innerHTML =
      '<div class="hint">▸ tocá cada bot para abrir el detalle</div>'
      + BOTS.map(function(c){ return renderBot(c, data[c.key]); }).join("");
    document.getElementById("total").innerHTML = renderTotal(data);
    document.getElementById("foot").innerHTML = renderFoot(data);
    renderLive(data);
  }

  var lastGood = null;
  function load(){
    var url = DATA_URL + (DATA_URL.indexOf("?")<0?"?":"&") + "_=" + Math.floor(Date.now()/60000);
    fetch(url, {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(function(j){ lastGood=j; paint(j); })
      .catch(function(){
        if(lastGood){ renderLive(lastGood); }
        else { paint(DEMO); }
      });
  }
  load();
  setInterval(load, 60000);
})();
</script>
